    let currentStatusFilter = 'all';

    function renderStudents(data) {
      const grid = document.getElementById("studentGrid");
      grid.innerHTML = data.map(s => {
        const folder = s.folderId || s.id;
        const thumbUrl = `./${folder}/thumbnail.png`;
        if (s.submitted) {
          return `
            <a href="./${folder}/index.html" class="student-card submitted" target="_blank">
              <div class="thumbnail-container">
                <img src="${thumbUrl}" alt="${s.name}的作品縮圖" onerror="this.onerror=null; this.parentElement.classList.add('no-thumb'); this.style.display='none';">
                <div class="thumb-placeholder">📄 檢視個人履歷與作品</div>
              </div>
              <div class="card-info">
                <div class="card-header">
                  <span class="student-id">${s.id}</span>
                  <span class="badge badge-success">已繳交</span>
                </div>
                <h3 class="student-name">${s.name}</h3>
              </div>
            </a>
          `;
        } else {
          return `
            <div class="student-card missing">
              <div class="thumbnail-container no-thumb">
                <div class="thumb-placeholder">📁 尚未提交</div>
              </div>
              <div class="card-info">
                <div class="card-header">
                  <span class="student-id">${s.id}</span>
                  <span class="badge badge-danger">缺交</span>
                </div>
                <h3 class="student-name">${s.name}</h3>
              </div>
            </div>
          `;
        }
      }).join('');
    }

    function setFilter(status, btn) {
      currentStatusFilter = status;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterStudents();
    }

    function filterStudents() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = students.filter(s => {
        const matchesQuery = s.id.toLowerCase().includes(query) || s.name.toLowerCase().includes(query);
        const matchesStatus = currentStatusFilter === 'all' ||
                              (currentStatusFilter === 'submitted' && s.submitted) ||
                              (currentStatusFilter === 'missing' && !s.submitted);
        return matchesQuery && matchesStatus;
      });
      renderStudents(filtered);
    }

    renderStudents(students);
  </script>
